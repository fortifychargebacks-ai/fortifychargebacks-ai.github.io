<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Professional Email</title>
  <style>
    /* Global Reset */
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0b0b;
      font-family: Arial, sans-serif;
    }

    /* Container & Main Card */
    .email-wrapper {
      background-color: transparent;
      padding: 0 !important;
    }
    .main-card {
      background-color: transparent;
      border-radius: 0;
      overflow: hidden;
      border: 1px solid #1f2933;
      max-width: 600px;
    }

    /* Header Section */
    .header-gradient {
      background: linear-gradient(135deg, #020617 0%, #020617 55%, #066cfa 100%);
      padding: 25px 30px;
      text-align: left;
    }
    .label-profile {
      font-size: 11px;
      letter-spacing: 3px;
      color: #e5e7eb;
      margin-bottom: 18px;
    }
    .user-name {
      font-weight: 800;
      font-size: 32px;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .user-title {
      font-size: 14px;
      color: #cbd5f5;
    }

    /* Content Section */
    .content-body {
      padding: 48px 44px;
      background-color: #020617;
    }
    .greeting {
      font-weight: 700;
      font-size: 16px;
      color: #ffffff;
      margin-bottom: 18px;
    }
    .main-text {
      font-size: 16px;
      color: #e5e7eb;
      line-height: 1.8;
      margin-bottom: 36px;
    }
    .accent-bar {
      width: 40px;
      height: 3px;
      background-color: #066cfa;
      margin-bottom: 18px;
    }
    .regards-label {
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      margin-bottom: 6px;
    }
    .footer-name {
      font-weight: 700;
      font-size: 18px;
      color: #ffffff;
    }

    /* Social Footer */
    .social-footer {
      padding: 44px 40px;
      background-color: #0b0b0b;
      border-top: 1px solid #1f2933;
    }
    .social-pill {
      text-decoration: none;
      display: block; /* Helps with link area */
    }

    /* ROUND ICON STYLING */
    .icon-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      line-height: 48px;
      display: inline-block;
    }

    .social-text {
      padding-top: 12px;
      font-size: 10px;
      color: #94a3b8;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-transform: capitalize;
      text-align: center; /* Enforces CSS centering */
    }

    /* Social Brand Colors */
    .bg-linkedin { background-color: #0b0b0b; }
    .bg-instagram { background: #0b0b0b; }
    .bg-github { background-color: #0b0b0b; }
    .bg-email { background-color: #0b0b0b; }

    /* SVG Alignment Fix */
    .icon-circle svg {
      vertical-align: middle;
      margin-top: -4px;
    }


    @media screen and (max-width: 480px) {
      .desktop-only { display: none !important; }
      .mobile-only { display: block !important; }
    }

  </style>
</head>
